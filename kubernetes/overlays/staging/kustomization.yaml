apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab-staging
resources:
  - ../../base
  - ingress.yaml
images:
  - name: registry.home/portfolio-manager:placeholder
    newName: portfolio-manager-portfolio-manager
    newTag: latest
patches:
  - path: patch-storage.yaml
    target:
      kind: Deployment
      name: portfolio-manager
