apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homelab-staging
resources:
  - ../../base
  - ingress.yaml
images:
  - name: registry.home/portfolio-manager:placeholder
    newName: registry.home/portfolio-manager
    newTag: latest
patches:
  - path: patch-storage.yaml
    target:
      kind: Deployment
      name: portfolio-manager
  - target:
      kind: Deployment
      name: portfolio-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
