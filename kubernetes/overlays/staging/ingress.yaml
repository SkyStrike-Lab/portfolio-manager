apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-manager-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  rules:
    - host: portfolio-staging.rath.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-manager
                port:
                  number: 8080
