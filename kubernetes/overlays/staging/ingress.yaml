apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: portfolio-manager-ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - portfolio-staging.rath.home
  rules:
    - host: portfolio-staging.rath.home
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: portfolio-manager
                port:
                  number: 8080
